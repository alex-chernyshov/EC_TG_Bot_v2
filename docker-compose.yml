# Shared settings for bot / scheduler / pi_server: one image, config from .env.
x-app-env: &app-env
  # Inside the compose network Postgres is reachable by service name on its default port,
  # whatever POSTGRES_HOST / POSTGRES_PORT say in .env (those are for running on the host).
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      DEPS_GROUP: server
  image: ec_tg_bot_v2-app
  restart: unless-stopped
  stop_grace_period: 30s
  depends_on:
    postgres:
      condition: service_healthy
  env_file: .env
  environment: *app-env
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - app_network

services:
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 30s

    # Bind only to localhost by default to avoid exposing Postgres to your LAN.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Store data under a subdir to avoid permission edge-cases on some hosts.
      PGDATA: /var/lib/postgresql/data/pgdata
      # Enforce password auth for both TCP and local socket connections.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"

    # Keep config minimal and explicit.
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

    # Improves performance for workloads that use larger temp buffers.
    shm_size: "256mb"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app_network

  bot:
    <<: *app
    command: ["python", "entrypoints/bot.py"]

  scheduler:
    <<: *app
    command: ["python", "entrypoints/scheduler.py"]

  pi_server:
    <<: *app
    command: ["python", "entrypoints/start_pi_server.py"]
    ports:
      - "${PI_SERVER_PORT:-5566}:5566"
    environment:
      <<: *app-env
      # Uvicorn always listens on 5566 inside the container; PI_SERVER_PORT only sets the host port.
      PI_SERVER_HOST: 0.0.0.0
      PI_SERVER_PORT: 5566

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
