[project]
name = "ec-tg-bot-v2"
version = "0.1.0"
description = "Telegram bot and heartbeat pipeline that monitors power availability"
readme = "README.md"
requires-python = ">=3.11"
# Shared by every process (server side and pi_client).
dependencies = [
    "loguru>=0.7.3",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
# Droplet processes: bot, scheduler, pi_server, migrations.
server = [
    "aiolimiter>=1.2.1",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.129.0",
    "python-telegram-bot[job-queue]>=22.6",
    "sqlalchemy[asyncio]>=2.0.46",
    "tenacity>=9.1.4",
    "uvicorn>=0.40.0",
]
# Raspberry Pi heartbeat sender. Kept separate so the Pi never builds asyncpg & co.
pi = [
    "httpx>=0.28.1",
]
dev = [
    "ruff>=0.15.1",
]

[tool.uv]
# This is an app, not a library: don't build/install the project itself.
package = false
# Local `uv sync` installs everything; Docker images pick only the group they need.
default-groups = ["server", "pi", "dev"]
